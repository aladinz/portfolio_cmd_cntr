<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Portfolio Overlap Heatmap — PORTFOLIO_COMM</title>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d29;
    --bg-card: #1e2133;
    --bg-input: #252839;
    --border: #2d3148;
    --border-hover: #3d4168;
    --text-primary: #e8eaed;
    --text-secondary: #9aa0b2;
    --text-muted: #6b7194;
    --accent: #4f8ff7;
    --accent-hover: #6ba1ff;
    --accent-dim: rgba(79,143,247,0.12);
    --green: #2ecc71;
    --green-bg: rgba(46,204,113,0.08);
    --green-border: rgba(46,204,113,0.3);
    --red: #e74c3c;
    --red-bg: rgba(231,76,60,0.08);
    --red-border: rgba(231,76,60,0.3);
    --yellow: #f39c12;
    --yellow-bg: rgba(243,156,18,0.08);
    --yellow-border: rgba(243,156,18,0.3);
    --gold: #d4a843;
    --purple: #9b59b6;
    --purple-bg: rgba(155,89,182,0.12);
    --purple-border: rgba(155,89,182,0.3);
    --cyan: #00bcd4;
    --cyan-bg: rgba(0,188,212,0.10);
    --cyan-border: rgba(0,188,212,0.3);
    --orange: #e67e22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    line-height: 1.6; min-height: 100vh;
  }

  /* ═══ HEADER ═══ */
  .header {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, #12141f 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, #e74c3c, #9b59b6, #4f8ff7);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .engine-badge {
    font-size: 11px; color: var(--gold); background: rgba(212,168,67,0.12);
    padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(212,168,67,0.25);
    font-weight: 500;
  }
  .timestamp-badge { font-size: 12px; color: var(--text-muted); }

  /* ═══ MAIN ═══ */
  .main { max-width: 1500px; margin: 0 auto; padding: 24px 32px; }

  /* ═══ TOOLBAR ═══ */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .toolbar-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; }
  .btn {
    padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 600; font-family: inherit;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary { background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  select.sort-select {
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-primary); padding: 8px 12px; border-radius: 8px;
    font-size: 12px; font-family: inherit; cursor: pointer; outline: none;
  }

  /* ═══ TOP METRICS ═══ */
  .metrics-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .metric-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; text-align: center;
    position: relative; overflow: hidden; transition: border-color 0.2s;
  }
  .metric-card:hover { border-color: var(--border-hover); }
  .metric-card .glow {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .metric-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px;
    color: var(--text-muted); margin-bottom: 6px; font-weight: 600;
  }
  .metric-value { font-size: 28px; font-weight: 700; }
  .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* ═══ SECTION TITLES ═══ */
  .section-title {
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title span { font-size: 20px; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

  /* ═══ HEATMAP ═══ */
  .heatmap-container {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-bottom: 28px;
  }
  .heatmap-header {
    padding: 16px 22px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .heatmap-header h3 { font-size: 15px; font-weight: 600; }
  .heatmap-scroll { overflow-x: auto; }

  table.heatmap { width: 100%; border-collapse: collapse; min-width: 800px; }
  table.heatmap thead th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); font-weight: 600; padding: 12px 10px;
    text-align: center; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary); white-space: nowrap;
  }
  table.heatmap thead th:first-child { text-align: left; padding-left: 20px; min-width: 120px; }
  table.heatmap thead th.portfolio-col { min-width: 130px; }
  table.heatmap thead th.summary-col { min-width: 90px; }

  table.heatmap tbody td {
    padding: 10px; text-align: center; border-bottom: 1px solid rgba(45,49,72,0.4);
    font-size: 13px; font-variant-numeric: tabular-nums; vertical-align: middle;
    transition: background 0.15s;
  }
  table.heatmap tbody tr:hover { background: rgba(79,143,247,0.04); }
  table.heatmap tbody td:first-child {
    text-align: left; padding-left: 20px; font-weight: 600;
  }
  table.heatmap tbody tr:last-child td { border-bottom: none; }

  .ticker-cell { display: flex; align-items: center; gap: 10px; }
  .ticker-symbol {
    font-weight: 700; font-size: 13px; color: var(--text-primary);
    background: var(--bg-input); padding: 3px 9px; border-radius: 5px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    min-width: 55px; text-align: center; letter-spacing: 0.3px;
  }
  .ticker-name { font-size: 11px; color: var(--text-secondary); font-weight: 400; max-width: 200px; }

  .heat-cell {
    border-radius: 6px; padding: 6px 10px; font-weight: 600;
    display: inline-block; min-width: 48px; font-size: 13px;
    transition: transform 0.15s;
  }
  .heat-cell:hover { transform: scale(1.1); }
  .heat-cell.empty { color: var(--text-muted); background: transparent; font-weight: 400; opacity: 0.4; }

  .freq-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .freq-1 { background: var(--accent-dim); color: var(--accent); }
  .freq-2 { background: var(--cyan-bg); color: var(--cyan); }
  .freq-3 { background: var(--yellow-bg); color: var(--yellow); }
  .freq-4 { background: var(--orange); color: #fff; background: rgba(230,126,34,0.2); color: var(--orange); }
  .freq-5 { background: var(--red-bg); color: var(--red); }

  .combined-weight {
    font-weight: 700; font-variant-numeric: tabular-nums;
  }

  /* ═══ HEATMAP LEGEND ═══ */
  .heatmap-legend {
    padding: 14px 22px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .legend-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
  .legend-gradient {
    display: flex; align-items: center; gap: 0; border-radius: 4px; overflow: hidden;
  }
  .legend-swatch { width: 32px; height: 16px; }
  .legend-range { font-size: 10px; color: var(--text-muted); margin-left: 6px; }

  /* ═══ OVERLAP ANALYSIS CARDS ═══ */
  .analysis-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px;
  }
  @media (max-width: 900px) { .analysis-grid { grid-template-columns: 1fr; } }

  .analysis-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  .analysis-card-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .analysis-card-header h3 { font-size: 14px; font-weight: 600; }
  .analysis-card-body { padding: 20px; }

  /* ═══ FREQUENCY BAR CHART ═══ */
  .freq-chart { display: flex; flex-direction: column; gap: 8px; }
  .freq-row {
    display: grid; grid-template-columns: 70px 1fr 40px; gap: 10px;
    align-items: center;
  }
  .freq-ticker {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px; font-weight: 700; text-align: right;
  }
  .freq-bar-bg {
    height: 22px; background: var(--bg-input); border-radius: 4px;
    overflow: hidden; position: relative;
  }
  .freq-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.5s ease;
    display: flex; align-items: center; padding-left: 8px;
  }
  .freq-bar-label {
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.9);
    white-space: nowrap;
  }
  .freq-count { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-align: center; }

  /* ═══ SIMILARITY MATRIX ═══ */
  table.sim-matrix { width: 100%; border-collapse: collapse; }
  table.sim-matrix th {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-muted); font-weight: 600; padding: 8px 6px;
    text-align: center; background: var(--bg-secondary); white-space: nowrap;
  }
  table.sim-matrix th:first-child { text-align: left; padding-left: 10px; }
  table.sim-matrix td {
    padding: 8px 6px; text-align: center; font-size: 13px;
    font-weight: 600; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid rgba(45,49,72,0.3);
  }
  table.sim-matrix td:first-child {
    text-align: left; padding-left: 10px; font-size: 11px;
    color: var(--text-secondary); white-space: nowrap;
  }
  table.sim-matrix tr:last-child td { border-bottom: none; }
  .sim-cell {
    display: inline-block; border-radius: 5px; padding: 4px 8px;
    min-width: 44px; font-size: 12px;
  }
  .sim-self { color: var(--text-muted); opacity: 0.5; }

  /* ═══ CONCENTRATION PANEL ═══ */
  .concentration-list { display: flex; flex-direction: column; gap: 6px; }
  .conc-row {
    display: grid; grid-template-columns: 70px 1fr 80px; gap: 10px;
    align-items: center; padding: 6px 0;
    border-bottom: 1px solid rgba(45,49,72,0.3);
  }
  .conc-row:last-child { border-bottom: none; }
  .conc-ticker {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px; font-weight: 700;
  }
  .conc-portfolios { display: flex; gap: 4px; flex-wrap: wrap; }
  .conc-pip {
    font-size: 9px; padding: 2px 7px; border-radius: 10px;
    font-weight: 600; white-space: nowrap;
    background: var(--bg-input); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .conc-total { font-size: 12px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  /* ═══ INSIGHT CALLOUTS ═══ */
  .insights-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .insight-card {
    background: var(--bg-card); border-radius: 12px; padding: 18px 20px;
    border-left: 4px solid; display: flex; gap: 12px;
  }
  .insight-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
  .insight-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .insight-body { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .insight-highlight { font-weight: 700; }

  /* ═══ TOOLTIP ═══ */
  .tooltip {
    position: fixed; z-index: 1000; pointer-events: none;
    background: #1a1d29; border: 1px solid var(--border-hover);
    border-radius: 10px; padding: 12px 16px; max-width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); opacity: 0;
    transition: opacity 0.15s;
    font-size: 12px;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-ticker { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .tooltip-name { color: var(--text-secondary); margin-bottom: 8px; font-size: 11px; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
  .tooltip-label { color: var(--text-muted); }
  .tooltip-value { font-weight: 600; }

  /* ═══ PRINT ═══ */
  @media print {
    body { background: #fff; color: #1a1a1a; }
    .header { background: #fff; border-color: #ddd; }
    .metric-card, .heatmap-container, .analysis-card, .insight-card { background: #fff; border-color: #ddd; }
    table.heatmap thead th, table.sim-matrix th { background: #f5f5f5; }
    .toolbar, .btn { display: none !important; }
    .heat-cell:hover { transform: none; }
    .tooltip { display: none !important; }
  }

  @media (max-width: 768px) {
    .header, .main { padding-left: 16px; padding-right: 16px; }
    .metrics-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .insights-grid { grid-template-columns: 1fr; }
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.35s ease; }
</style>
</head>

      <div class="analysis-card-body">

    </div>

  </div>

</div>

// ═══════════════════════════════════════════════════
// DATA PROCESSING
// ═══════════════════════════════════════════════════
let showSharedOnly = false;

function buildTickerMap() {
  const map = {}; // ticker -> { name, role, portfolios: [{id, short, pct, color}] }
  for (const pf of PORTFOLIOS) {
    for (const h of pf.holdings) {
      if (!map[h.ticker]) {
        map[h.ticker] = { name: h.name, role: h.role, portfolios: [] };
      }
      map[h.ticker].portfolios.push({ id: pf.id, short: pf.short, name: pf.name, pct: h.pct, color: pf.color });
    }
  }
  return map;
}

function getTickerList(tickerMap, sortMode, sharedOnly) {
  let list = Object.entries(tickerMap).map(([ticker, data]) => ({
    ticker, ...data,
    frequency: data.portfolios.length,
    combinedWeight: data.portfolios.reduce((s, p) => s + p.pct, 0)
  }));

  if (sharedOnly) list = list.filter(t => t.frequency > 1);

  switch (sortMode) {
    case 'frequency-desc': list.sort((a, b) => b.frequency - a.frequency || b.combinedWeight - a.combinedWeight); break;
    case 'frequency-asc': list.sort((a, b) => a.frequency - b.frequency || a.combinedWeight - b.combinedWeight); break;
    case 'weight-desc': list.sort((a, b) => b.combinedWeight - a.combinedWeight); break;
    case 'weight-asc': list.sort((a, b) => a.combinedWeight - b.combinedWeight); break;
    case 'alpha-asc': list.sort((a, b) => a.ticker.localeCompare(b.ticker)); break;
    case 'alpha-desc': list.sort((a, b) => b.ticker.localeCompare(a.ticker)); break;
  }
  return list;
}

function heatColor(pct) {
  if (pct === 0) return 'transparent';
  if (pct <= 5) return 'rgba(79,143,247,0.2)';
  if (pct <= 10) return 'rgba(79,143,247,0.35)';
  if (pct <= 15) return 'rgba(46,204,113,0.35)';
  if (pct <= 20) return 'rgba(243,156,18,0.4)';
  if (pct <= 25) return 'rgba(230,126,34,0.45)';
  if (pct <= 35) return 'rgba(231,76,60,0.45)';
  return 'rgba(231,76,60,0.65)';
}

function heatTextColor(pct) {
  if (pct === 0) return 'var(--text-muted)';
  if (pct <= 10) return '#8bb8f7';
  if (pct <= 15) return '#5edba0';
  if (pct <= 20) return '#f5c842';
  if (pct <= 30) return '#f0a050';
  return '#f07070';
}

function freqColor(freq) {
  const colors = { 1: '#4f8ff7', 2: '#00bcd4', 3: '#f39c12', 4: '#e67e22', 5: '#e74c3c' };
  return colors[freq] || '#4f8ff7';
}

function jaccardSimilarity(pf1, pf2) {
  const set1 = new Set(pf1.holdings.map(h => h.ticker));
  const set2 = new Set(pf2.holdings.map(h => h.ticker));
  const intersection = [...set1].filter(t => set2.has(t)).length;
  const union = new Set([...set1, ...set2]).size;
  return union === 0 ? 0 : intersection / union;
}

function simColor(val) {
  if (val >= 0.5) return 'rgba(231,76,60,0.35)';
  if (val >= 0.3) return 'rgba(243,156,18,0.3)';
  if (val >= 0.15) return 'rgba(79,143,247,0.25)';
  return 'rgba(79,143,247,0.1)';
}

// ═══════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════

    </div>

      <div class="glow" style="background:var(--red)"></div>
      <div class="metric-label">Most Overlapping</div>
      <div class="metric-value" style="color:var(--red);font-size:22px;">${mostOverlap[0]}</div>
      <div class="metric-sub">${mostOverlap[1].portfolios.length} portfolios</div>
    </div>

      <div class="metric-label">Highest Combined</div>

  const schdWeight = schd.portfolios.reduce((s, p) => s + p.pct, 0);
  document.getElementById('insightsGrid').innerHTML = `
    <div class="insight-card" style="border-color:var(--red);">
      <div class="insight-icon">🏆</div>
      <div>
        <div class="insight-title">SCHD is Your Universal Anchor</div>
        <div class="insight-body">
          Appears in <span class="insight-highlight">${schd.portfolios.length}/5</span> portfolios (${schdPorts}) with a combined
          <span class="insight-highlight">${schdWeight}%</span> allocation. This is intentional — quality dividend income across all account types.
        </div>
      </div>
    </div>
    <div class="insight-card" style="border-color:var(--yellow);">
      <div class="insight-icon">⚡</div>
      <div>
        <div class="insight-title">Tax-Aware Placement</div>
        <div class="insight-body">
          High-growth assets (SMH, VRT) live in the <span class="insight-highlight">tax-free Roth</span>.
          Conservative SGOV anchors the <span class="insight-highlight">taxable accounts</span>.
          Defensive USMV is exclusive to the <span class="insight-highlight">Traditional IRA</span>.
        </div>
      </div>
    </div>
    <div class="insight-card" style="border-color:var(--green);">
      <div class="insight-icon">🧬</div>
      <div>
        <div class="insight-title">${uniqueOnly.length} Specialist Holdings</div>

    </div>
    <div class="insight-card" style="border-color:var(--accent);">
      <div class="insight-icon">🌐</div>
      <div>
        <div class="insight-title">International Coverage: VXUS × 3</div>

  }

  for (const t of tickerList) {

  // ── Frequency Chart ──

  const maxCombined = Math.max(...allTickers.map(t => t.combinedWeight));
  let freqHTML = '';
  for (const t of allTickers) {
    const barW = (t.combinedWeight / maxCombined * 100).toFixed(1);
    const c = freqColor(t.frequency);
    const portions = t.portfolios.map(p => `${p.short}:${p.pct}%`).join('  ');
    freqHTML += `
      <div class="freq-row">
        <div class="freq-ticker" style="color:${c}">${t.ticker}</div>
        <div class="freq-bar-bg">

    if (uniqueness < 40) barColor = '#e74c3c';

          <div style="height:100%;width:${uniqueness}%;background:${barColor};border-radius:4px;transition:width 0.5s;"></div>

  uniqHTML += '</div>';
  document.getElementById('uniquenessReport').innerHTML = uniqHTML;
}

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

function showTooltip(e, ticker, name, portfolio, pct, role) {
  tooltip.innerHTML = `
    <div class="tooltip-ticker">${ticker}</div>
    <div class="tooltip-name">${name}</div>
    <div class="tooltip-row"><span class="tooltip-label">Portfolio:</span><span class="tooltip-value">${portfolio}</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Allocation:</span><span class="tooltip-value">${pct}%</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Role:</span><span class="tooltip-value" style="font-weight:400;max-width:160px;text-align:right;">${role}</span></div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function hideTooltip() { tooltip.classList.remove('visible'); }
function moveTooltip(e) {
  const pad = 16;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - pad) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - pad) y = e.clientY - rect.height - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

// ═══════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════
function toggleFilter() {
  showSharedOnly = !showSharedOnly;
  const btn = document.getElementById('filterSharedBtn');
  btn.classList.toggle('active', showSharedOnly);
  btn.textContent = showSharedOnly ? '🔗 Show All' : '🔗 Shared Only';
  renderAll();
}
