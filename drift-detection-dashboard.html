<title>Drift-Detection Dashboard — PORTFOLIO_COMM</title>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d29;
    --bg-card: #1e2133;
    --bg-input: #252839;
    --border: #2d3148;
    --border-hover: #3d4168;
    --text-primary: #e8eaed;
    --text-secondary: #9aa0b2;
    --text-muted: #6b7194;
    --accent: #4f8ff7;
    --accent-hover: #6ba1ff;
    --accent-dim: rgba(79,143,247,0.15);
    --green: #2ecc71;
    --green-bg: rgba(46,204,113,0.1);
    --green-border: rgba(46,204,113,0.3);
    --red: #e74c3c;
    --red-bg: rgba(231,76,60,0.1);
    --red-border: rgba(231,76,60,0.3);
    --yellow: #f39c12;
    --yellow-bg: rgba(243,156,18,0.1);
    --yellow-border: rgba(243,156,18,0.3);
    --gold: #d4a843;
    --purple: #9b59b6;
    --purple-bg: rgba(155,89,182,0.1);
    --cyan: #00bcd4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    line-height: 1.6; min-height: 100vh;
  }

  /* ═══ HEADER ═══ */
  .header {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, #12141f 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, #e74c3c, #f39c12, #2ecc71);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .engine-badge {
    font-size: 11px; color: var(--gold); background: rgba(212,168,67,0.12);
    padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(212,168,67,0.25);
    font-weight: 500;
  }
  .timestamp { font-size: 12px; color: var(--text-muted); }

  /* ═══ MAIN ═══ */
  .main { max-width: 1440px; margin: 0 auto; padding: 24px 32px; }

  /* ═══ TOP METRICS BAR ═══ */
  .metrics-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .metric-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; text-align: center;
    position: relative; overflow: hidden; transition: border-color 0.2s;
  }
  .metric-card:hover { border-color: var(--border-hover); }
  .metric-card .glow {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .metric-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px;
    color: var(--text-muted); margin-bottom: 6px; font-weight: 600;
  }
  .metric-value { font-size: 28px; font-weight: 700; }
  .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* ═══ REVIEW COUNTDOWN ═══ */
  .review-countdown {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 24px; margin-bottom: 28px;
    display: flex; flex-wrap: wrap; gap: 28px; align-items: center;
  }
  .countdown-block { text-align: center; }
  .countdown-number { font-size: 32px; font-weight: 700; color: var(--accent); }
  .countdown-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); }
  .countdown-divider { width: 1px; height: 48px; background: var(--border); }
  .countdown-info { flex: 1; min-width: 200px; }
  .countdown-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .countdown-info p { font-size: 12px; color: var(--text-secondary); }

  /* ═══ PORTFOLIO OVERVIEW GRID ═══ */
  .section-title {
    font-size: 16px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title span { font-size: 20px; }

  .overview-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .overview-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; cursor: pointer;
    transition: all 0.25s; position: relative; overflow: hidden;
  }
  .overview-card:hover { border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .overview-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .overview-card .health-glow {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .oc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .oc-name { font-size: 15px; font-weight: 600; }
  .oc-type { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .health-ring {
    width: 52px; height: 52px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .health-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .health-ring .score { font-size: 14px; font-weight: 700; z-index: 1; }
  .oc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .oc-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); }
  .oc-stat-value { font-size: 13px; font-weight: 600; }

  /* ═══ DETAIL PANEL ═══ */
  .detail-panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 28px; overflow: hidden;
    display: none;
  }
  .detail-panel.active { display: block; }
  .detail-header {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .detail-header-left h2 { font-size: 18px; font-weight: 600; }
  .detail-header-left p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .detail-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .dbadge {
    font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 500;
  }
  .dbadge-deferred { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .dbadge-free { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .dbadge-taxable { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .dbadge-broker { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(79,143,247,0.3); }

  /* Philosophy strip */
  .philosophy-strip {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    background: rgba(79,143,247,0.03);
  }
  .ps-block h4 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent); margin-bottom: 6px; font-weight: 600;
  }
  .ps-block p { font-size: 12px; color: var(--text-secondary); line-height: 1.65; }

  /* ═══ DRIFT VISUALIZATION ═══ */
  .drift-grid {
    padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .drift-row {
    display: grid; grid-template-columns: 100px 60px 1fr 60px 60px 90px;
    gap: 12px; align-items: center;
    padding: 12px 16px; border-radius: 10px;
    background: var(--bg-secondary); border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .drift-row:hover { border-color: var(--border-hover); }
  .drift-row.alert-row { border-color: var(--yellow-border); background: rgba(243,156,18,0.04); }

  .dr-ticker {
    font-weight: 700; font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 14px; background: var(--bg-input); padding: 4px 10px;
    border-radius: 6px; text-align: center;
  }
  .dr-target { font-size: 13px; color: var(--text-secondary); text-align: right; }

  .drift-bar-container {
    height: 32px; position: relative; border-radius: 6px;
    background: var(--bg-input); overflow: visible;
  }
  .drift-bar-target {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 6px; opacity: 0.25;
  }
  .drift-bar-current {
    position: absolute; top: 4px; left: 0; height: calc(100% - 8px);
    border-radius: 4px; transition: width 0.4s ease;
    min-width: 2px;
  }
  .drift-bar-marker {
    position: absolute; top: -4px; bottom: -4px; width: 2px;
    border-radius: 1px;
  }

  .dr-current-input {
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-primary); padding: 5px 8px; border-radius: 6px;
    font-size: 13px; width: 56px; text-align: right;
    font-family: inherit; outline: none; font-variant-numeric: tabular-nums;
  }
  .dr-current-input:focus { border-color: var(--accent); }

  .dr-drift {
    font-size: 13px; font-weight: 600; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .dr-drift.positive { color: var(--green); }
  .dr-drift.negative { color: var(--red); }
  .dr-drift.zero { color: var(--text-muted); }

  .dr-status {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; text-align: center;
  }
  .status-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .status-warn { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .status-crit { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

  .drift-legend {
    padding: 0 24px 20px; display: flex; gap: 24px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ═══ DRIFT COLUMN HEADERS ═══ */
  .drift-col-headers {
    display: grid; grid-template-columns: 100px 60px 1fr 60px 60px 90px;
    gap: 12px; padding: 0 24px 8px; align-items: center;
  }
  .dch {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px;
    color: var(--text-muted); font-weight: 600;
  }
  .dch.right { text-align: right; }
  .dch.center { text-align: center; }

  /* ═══ ALERT PANEL ═══ */
  .alert-panel {
    margin: 0 24px 24px; padding: 16px 20px;
    border-radius: 10px; display: none;
  }
  .alert-panel.has-alerts {
    display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
    background: var(--red-bg); border: 1px solid var(--red-border);
  }
  .alert-panel.all-clear {
    display: flex; gap: 12px; align-items: center;
    background: var(--green-bg); border: 1px solid var(--green-border);
  }
  .alert-icon { font-size: 20px; flex-shrink: 0; }
  .alert-content h4 { font-size: 13px; font-weight: 600; }
  .alert-content p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .alert-list { list-style: none; margin-top: 8px; }
  .alert-list li {
    font-size: 12px; padding: 4px 0; display: flex; align-items: center; gap: 6px;
    color: var(--text-secondary);
  }
  .alert-list li::before { content: "⚠"; font-size: 11px; }

  /* ═══ NOTES ═══ */
  .detail-notes {
    padding: 16px 24px; border-top: 1px solid var(--border);
  }
  .detail-notes h4 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-muted); margin-bottom: 10px; font-weight: 600;
  }
  .detail-notes ul { list-style: none; }
  .detail-notes li {
    font-size: 12px; color: var(--text-secondary); padding: 5px 0;
    border-bottom: 1px solid rgba(45,49,72,0.3);
    display: flex; gap: 8px;
  }
  .detail-notes li:last-child { border-bottom: none; }
  .detail-notes li::before { content: "›"; color: var(--accent); font-weight: 700; flex-shrink: 0; }

  /* ═══ UPDATE BUTTON ═══ */
  .update-bar {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .btn {
    padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary { background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  /* ═══ PRINT ═══ */
  .print-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; gap: 10px; }

  @media print {
    body { background: #fff; color: #1a1a1a; }
    .header { background: #fff; border-color: #ddd; }
    .metric-card, .overview-card, .detail-panel, .review-countdown,
    .drift-row { background: #fff; border-color: #ddd; }
    .drift-bar-container { background: #eee; }
    .btn, .print-bar, .dr-current-input { display: none; }
    .overview-card:hover { transform: none; box-shadow: none; }
  }

  @media (max-width: 768px) {
    .header, .main { padding-left: 16px; padding-right: 16px; }
    .philosophy-strip { grid-template-columns: 1fr; }
    .drift-row { grid-template-columns: 80px 50px 1fr 50px 50px 80px; gap: 8px; padding: 10px 12px; }
    .drift-col-headers { grid-template-columns: 80px 50px 1fr 50px 50px 80px; gap: 8px; }
    .overview-grid { grid-template-columns: 1fr; }
  }

  .hidden { display: none; }

  /* ═══ ANIMATIONS ═══ */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .detail-panel.active { animation: fadeIn 0.3s ease; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .pulse { animation: pulse 1.5s ease infinite; }
</style>
</head>

// ═══════════════════════════════════════════════════
// CALCULATIONS
// ═══════════════════════════════════════════════════
function calcDrift(portfolioId) {
  const pf = PORTFOLIOS[portfolioId];
  const cv = currentValues[portfolioId];
  const threshold = pf.rebalancing_policy.threshold_pct;
  const results = [];
  let maxAbsDrift = 0;
  let totalAbsDrift = 0;
  let breaches = 0;

  for (const alloc of pf.target_allocation) {
    const current = cv[alloc.ticker] ?? alloc.target_pct;
    const drift = current - alloc.target_pct;
    const absDrift = Math.abs(drift);
    if (absDrift > maxAbsDrift) maxAbsDrift = absDrift;
    totalAbsDrift += absDrift;
    if (absDrift >= threshold) breaches++;

    let severity = 'ok';
    if (absDrift >= threshold) severity = 'crit';
    else if (absDrift >= threshold * 0.5) severity = 'warn';

    results.push({
      ticker: alloc.ticker, name: alloc.name, role: alloc.role,
      target: alloc.target_pct, current, drift, absDrift, severity
    });
  }

  const avgDrift = totalAbsDrift / results.length;
  // Health score: 100 when all at target, decreases with drift
  const healthScore = Math.max(0, Math.round(100 - (totalAbsDrift * 3)));

  return { results, maxAbsDrift, avgDrift, totalAbsDrift, breaches, healthScore, threshold };
}

function getHealthColor(score) {
  if (score >= 85) return var_green;
  if (score >= 60) return var_yellow;
  return var_red;
}
const var_green = '#2ecc71', var_yellow = '#f39c12', var_red = '#e74c3c', var_accent = '#4f8ff7';

function taxBadgeClass(status) {
  if (status === 'tax-deferred') return 'dbadge-deferred';
  if (status === 'tax-free') return 'dbadge-free';
  return 'dbadge-taxable';
}

function renderCountdown() {
  const nextReview = new Date('2026-06-15T00:00:00');
  const now = new Date();
  const diffMs = nextReview - now;
  const totalDays = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
  const weeks = Math.floor(totalDays / 7);
  const days = totalDays % 7;

  let urgencyColor = var_accent;
  let urgencyLabel = 'On Track';
  if (totalDays <= 7) { urgencyColor = var_red; urgencyLabel = 'Imminent'; }
  else if (totalDays <= 30) { urgencyColor = var_yellow; urgencyLabel = 'Approaching'; }

  document.getElementById('reviewCountdown').innerHTML = `
    <div class="countdown-block">
      <div class="countdown-number" style="color:${urgencyColor}">${totalDays}</div>
      <div class="countdown-label">Days Until Review</div>
    </div>
    <div class="countdown-divider"></div>
    <div class="countdown-block">
      <div class="countdown-number" style="color:${urgencyColor}">${weeks}w ${days}d</div>

}

// TOP METRICS (aggregate across all portfolios)
// ═══════════════════════════════════════════════════
function renderMetrics() {
  let totalPositions = 0, totalBreaches = 0, worstDrift = 0, worstPortfolio = '';
  let healthSum = 0, portfolioCount = 0;
  let allOk = true;

  for (const [id, pf] of Object.entries(PORTFOLIOS)) {
    const d = calcDrift(id);
    totalPositions += d.results.length;
    totalBreaches += d.breaches;
    healthSum += d.healthScore;
    portfolioCount++;
    if (d.maxAbsDrift > worstDrift) { worstDrift = d.maxAbsDrift; worstPortfolio = pf.portfolio_name; }
    if (d.breaches > 0) allOk = false;
  }

  const avgHealth = Math.round(healthSum / portfolioCount);
  const avgHealthColor = getHealthColor(avgHealth);
  const statusLabel = allOk ? 'ALL CLEAR' : `${totalBreaches} ALERT${totalBreaches>1?'S':''}`;
  const statusColor = allOk ? var_green : var_red;
  const worstColor = worstDrift >= 5 ? var_red : worstDrift >= 2.5 ? var_yellow : var_green;

  document.getElementById('metricsBar').innerHTML = `
    <div class="metric-card">
      <div class="glow" style="background:${avgHealthColor}"></div>
      <div class="metric-label">Avg Health Score</div>
      <div class="metric-value" style="color:${avgHealthColor}">${avgHealth}</div>
      <div class="metric-sub">across ${portfolioCount} portfolios</div>

    <div class="metric-card">

      <div class="metric-label">System Status</div>
      <div class="metric-value" style="color:${statusColor};font-size:20px">${statusLabel}</div>
      <div class="metric-sub">${totalPositions} total positions monitored</div>
    </div>
    <div class="metric-card">
      <div class="glow" style="background:${var_accent}"></div>
      <div class="metric-label">Total Positions</div>
      <div class="metric-value" style="color:${var_accent}">${totalPositions}</div>
      <div class="metric-sub">across ${portfolioCount} accounts</div>
    </div>
    <div class="metric-card">
      <div class="glow" style="background:${worstColor}"></div>
      <div class="metric-label">Max Drift</div>
      <div class="metric-value" style="color:${worstColor}">${worstDrift.toFixed(1)}%</div>

}

// ═══════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════
function updateCurrent(input) {
  const pid = input.dataset.portfolio;
  const ticker = input.dataset.ticker;
  const val = parseFloat(input.value);
  if (isNaN(val)) return;
  currentValues[pid][ticker] = val;
  refreshAll();
}

function resetPortfolioCurrent(pid) {
  const pf = PORTFOLIOS[pid];
  for (const h of pf.current_holdings) {
    currentValues[pid][h.ticker] = h.current_pct;
  }
  refreshAll();
}

function resetAllCurrents() {
  for (const [id, pf] of Object.entries(PORTFOLIOS)) {
    for (const h of pf.current_holdings) {
      currentValues[id][h.ticker] = h.current_pct;
    }
  }
  refreshAll();
}

function simulateDrift(pid) {
  const pf = PORTFOLIOS[pid];
  const drifts = [];
  let totalShift = 0;

  // Generate random drifts
  for (let i = 0; i < pf.target_allocation.length; i++) {
    const alloc = pf.target_allocation[i];
    const maxDrift = Math.min(alloc.target_pct, 12); // don't drift more than the target itself
    const drift = (Math.random() - 0.5) * maxDrift; // random between -maxDrift/2 and +maxDrift/2
    drifts.push(drift);
    totalShift += drift;
  }

  // Normalize so total still sums to 100
  const correction = totalShift / drifts.length;
  for (let i = 0; i < pf.target_allocation.length; i++) {
    const alloc = pf.target_allocation[i];
    let newVal = alloc.target_pct + drifts[i] - correction;
    newVal = Math.max(0.1, Math.round(newVal * 10) / 10);
    currentValues[pid][alloc.ticker] = newVal;
  }

  // Fine-tune to sum to 100
  const sum = Object.values(currentValues[pid]).reduce((a, b) => a + b, 0);
  const diff = 100 - sum;
  const firstTicker = pf.target_allocation[0].ticker;
  currentValues[pid][firstTicker] = Math.round((currentValues[pid][firstTicker] + diff) * 10) / 10;

  refreshAll();
}

function refreshAll() {
  renderMetrics();
  renderOverview();
  if (activeDetail) renderDetailPanel();
}
